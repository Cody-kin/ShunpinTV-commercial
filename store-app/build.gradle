plugins { id 'com.android.application' }
android {
 namespace 'com.harbour.tv'
 compileSdk 35
 defaultConfig {
  applicationId 'com.harbour.tv.store'
  minSdk 26
  targetSdk 35
  versionCode 4
  versionName '0.1.3-commercial-preview'
  buildConfigField 'boolean', 'PERSONAL_BUILD', 'false'
  buildConfigField 'long', 'STARTUP_TIMEOUT_MS', '45000L'
  buildConfigField 'String', 'HTTP_PLAYBACK_HOSTS', '""'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 lint { abortOnError true }
}
dependencies {
 implementation project(':core')
 implementation project(':llm')
 implementation 'androidx.annotation:annotation:1.6.0'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
}
